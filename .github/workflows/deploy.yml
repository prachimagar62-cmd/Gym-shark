name: Build and deploy to AWS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  STACK_NAME: GymsharkStore
  MONGO_SECRET_NAME: GymsharkStore/production/MONGODB_URI

jobs:
  build-and-deploy:
    if: vars.AWS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install and build frontend
        run: npm ci && npm run build

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Find the EC2 instance
        id: instance
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:GymsharkApp,Values=$STACK_NAME" "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId | [0]' \
            --output text)
          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "No running EC2 instance found for stack $STACK_NAME" >&2
            exit 1
          fi
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for Systems Manager agent
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
        run: |
          for attempt in $(seq 1 60); do
            STATUS=$(aws ssm describe-instance-information \
              --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
              --query 'InstanceInformationList[0].PingStatus' \
              --output text)
            if [ "$STATUS" = "Online" ]; then
              echo "Systems Manager agent is online."
              exit 0
            fi
            echo "Waiting for Systems Manager agent (attempt $attempt/60)."
            sleep 10
          done
          echo "Systems Manager agent did not come online." >&2
          exit 1

      - name: Deploy through Systems Manager
        env:
          INSTANCE_ID: ${{ steps.instance.outputs.instance_id }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const secretName = process.env.MONGO_SECRET_NAME;
          const commands = [
            'set -eu',
            'cd /var/www/gymshark',
            'sudo -u ubuntu git -C /var/www/gymshark fetch origin main',
            'sudo -u ubuntu git -C /var/www/gymshark reset --hard origin/main',
            `umask 077; MONGODB_URI=$(aws secretsmanager get-secret-value --secret-id '${secretName}' --query SecretString --output text); printf 'PORT=5000\\nNODE_ENV=production\\nMONGODB_URI=%s\\n' "$MONGODB_URI" > /var/www/gymshark/.env; unset MONGODB_URI; chown ubuntu:ubuntu /var/www/gymshark/.env; chmod 600 /var/www/gymshark/.env`,
            'sudo -u ubuntu bash -lc "cd /var/www/gymshark && npm ci && npm run build"',
            'sudo cp infra/nginx.conf /etc/nginx/sites-available/gymshark',
            'sudo nginx -t',
            'sudo systemctl reload nginx',
            'sudo -u ubuntu pm2 startOrReload /var/www/gymshark/server/ecosystem.config.cjs --update-env',
            'sudo -u ubuntu pm2 save'
          ];
          fs.writeFileSync('/tmp/ssm-parameters.json', JSON.stringify({ commands }));
          NODE

          COMMAND_ID=$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$INSTANCE_ID" \
            --parameters file:///tmp/ssm-parameters.json \
            --comment "Deploy ${GITHUB_SHA}" \
            --query 'Command.CommandId' \
            --output text)

          for attempt in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)
            case "$STATUS" in
              Success)
                echo "Deployment completed successfully."
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' --output json
                exit 1
                ;;
            esac
            echo "SSM deployment status: ${STATUS:-Pending} (attempt $attempt/60)"
            sleep 10
          done
          echo "Timed out waiting for deployment command $COMMAND_ID" >&2
          exit 1