server {
    listen 80;
    listen [::]:80;
    server_name _;

    client_max_body_size 25M;

    # ── 1. FRONTEND: Serve compiled React static files ───────────────────────
    root /var/www/app/frontend/dist;
    index index.html;

    # Single Page Application (SPA) routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── 2. BACKEND API: Reverse proxy to Express on port 5000 ────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    # ── 3. STATIC IMAGES: Proxy to Express static image route ────────────────
    location /image/ {
        proxy_pass http://127.0.0.1:5000/image/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # ── 4. HEALTH CHECK ──────────────────────────────────────────────────────
    location /health {
        return 200 'Gymshark Live OK';
        add_header Content-Type text/plain;
    }

    # ── 5. LOGGING ───────────────────────────────────────────────────────────
    access_log /var/log/nginx/gymshark.access.log;
    error_log  /var/log/nginx/gymshark.error.log;
}
