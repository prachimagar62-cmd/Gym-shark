AWSTemplateFormatVersion: "2010-09-09"
Description: Gymshark MERN app on Ubuntu EC2 with Nginx, PM2, SSM, and MongoDB Atlas

Parameters:
  GitHubRepositoryUrl:
    Type: String
    Description: Public GitHub HTTPS clone URL ending in .git
    AllowedPattern: '^https://github\.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+\.git$'
  BranchName:
    Type: String
    Default: main
  GitHubOwner:
    Type: String
    Default: prachimagar62-cmd
    Description: GitHub account or organization that owns the repository
  GitHubRepository:
    Type: String
    Default: Gym-shark
    Description: GitHub repository name without owner or .git
  InstanceType:
    Type: String
    Default: t3.small
    AllowedValues:
      - t3.micro
      - t3.small
      - t3.medium
    Description: t3.small is recommended for building React on the EC2 server
  UbuntuAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id
    Description: Region-specific latest Ubuntu 24.04 LTS x86_64 AMI

Resources:
  AppVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-vpc"

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-igw"

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref AppVpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref AppVpc
      CidrBlock: 10.42.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-public"

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref AppVpc

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public web only; administer this instance through Systems Manager
      VpcId: !Ref AppVpc
      SecurityGroupIngress:
        - Description: HTTP
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - Description: HTTPS
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: GymsharkApp
          Value: GymsharkStore

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: ReadGymsharkProductionSecret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:GymsharkStore/production-*"

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InstanceRole

  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-github-deploy"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubOwner}/${GitHubRepository}:ref:refs/heads/${BranchName}"
      Policies:
        - PolicyName: DeployGymsharkThroughSsm
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: FindTaggedAppInstance
                Effect: Allow
                Action: ec2:DescribeInstances
                Resource: "*"
              - Sid: WaitForSsmAgent
                Effect: Allow
                Action: ssm:DescribeInstanceInformation
                Resource: "*"
              - Sid: UseShellDocument
                Effect: Allow
                Action: ssm:SendCommand
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-RunShellScript"
              - Sid: DeployOnlyToGymsharkInstances
                Effect: Allow
                Action: ssm:SendCommand
                Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
                Condition:
                  StringEquals:
                    ssm:resourceTag/GymsharkApp: GymsharkStore
              - Sid: ReadSsmCommandResult
                Effect: Allow
                Action: ssm:GetCommandInvocation
                Resource: "*"

  AppInstance:
    Type: AWS::EC2::Instance
    DependsOn:
      - DefaultRoute
    Properties:
      ImageId: !Ref UbuntuAmi
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds:
        - !Ref AppSecurityGroup
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 24
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-server"
        - Key: GymsharkApp
          Value: GymsharkStore
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          exec > >(tee -a /var/log/gymshark-bootstrap.log) 2>&1

          apt-get update -y
          apt-get install -y ca-certificates curl git nginx awscli jq
          curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
          apt-get install -y nodejs
          npm install --global pm2

          mkdir -p /var/www
          git clone --branch '${BranchName}' --depth 1 '${GitHubRepositoryUrl}' /var/www/app
          chown -R ubuntu:ubuntu /var/www/app

          cp /var/www/app/infra/nginx.conf /etc/nginx/sites-available/gymshark
          ln -sfn /etc/nginx/sites-available/gymshark /etc/nginx/sites-enabled/gymshark
          rm -f /etc/nginx/sites-enabled/default
          nginx -t
          systemctl enable --now nginx
          systemctl enable --now snap.amazon-ssm-agent.amazon-ssm-agent.service || systemctl enable --now amazon-ssm-agent

          pm2 startup systemd -u ubuntu --hp /home/ubuntu | tail -n 1 | bash

  AppElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-ip"

  AppElasticIpAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt AppElasticIp.AllocationId
      InstanceId: !Ref AppInstance

Outputs:
  PublicIP:
    Description: Stable Elastic IP for the app and Atlas IP allow-list
    Value: !Ref AppElasticIp
  PublicURL:
    Description: App URL; HTTPS requires a domain and TLS setup
    Value: !Sub "http://${AppElasticIp}"
  InstanceId:
    Description: EC2 instance ID for GitHub Actions and Systems Manager
    Value: !Ref AppInstance
  MongoSecretName:
    Description: Secrets Manager secret name expected by the app
    Value: GymsharkStore/production
  GitHubDeployRoleArn:
    Description: Add this ARN as GitHub Actions secret AWS_DEPLOY_ROLE_ARN
    Value: !GetAtt GitHubDeployRole.Arn