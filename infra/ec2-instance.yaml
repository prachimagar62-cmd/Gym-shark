AWSTemplateFormatVersion: '2010-09-09'
Description: Gymshark MERN Stack Hosting Infrastructure (EC2 + SSM KeyPair + Security Group)

Parameters:
  InstanceType:
    Type: String
    Default: t2.micro
    Description: EC2 instance type (t2.micro is free-tier eligible)

  UbuntuAMI:
    Type: String
    Default: ami-0e86e20dae9224db8
    Description: Ubuntu 24.04 LTS AMI in us-east-1

  SSHLocation:
    Type: String
    Default: 0.0.0.0/0
    Description: Allow SSH from anywhere (for GitHub Actions runners)

Resources:

  # 1. SSH KeyPair — private key auto-saved to Systems Manager Parameter Store
  ServerKeyPair:
    Type: AWS::EC2::KeyPair
    Properties:
      KeyName: !Sub "${AWS::StackName}-key"

  # 2. Security Group — opens Port 80 (HTTP) and Port 22 (SSH)
  ServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP and SSH inbound traffic for Gymshark
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref SSHLocation

  # 3. Ubuntu 24.04 Virtual Machine with Bootstrap UserData
  ServerInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref UbuntuAMI
      InstanceType: !Ref InstanceType
      KeyName: !Ref ServerKeyPair
      SecurityGroupIds:
        - !GetAtt ServerSecurityGroup.GroupId
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-server"
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -e
          exec > /var/log/userdata.log 2>&1

          # 1. Enable 2GB swap space (prevents out-of-memory errors on t2.micro)
          if [ ! -f /swapfile ]; then
            fallocate -l 2G /swapfile
            chmod 600 /swapfile
            mkswap /swapfile
            swapon /swapfile
            echo '/swapfile none swap sw 0 0' >> /etc/fstab
          fi

          # 2. System update & install Node.js 22, Git, Nginx
          apt-get update -y
          curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
          apt-get install -y nodejs nginx git

          # 3. Install PM2 globally
          npm install -g pm2

          # 4. Clone Gymshark repository
          mkdir -p /var/www/app
          git clone https://github.com/Prince-KC/Gymshark.git /var/www/app

          # 5. Configure Nginx
          cp /var/www/app/infra/nginx.conf /etc/nginx/sites-available/gymshark
          ln -sf /etc/nginx/sites-available/gymshark /etc/nginx/sites-enabled/gymshark
          rm -f /etc/nginx/sites-enabled/default

          nginx -t
          systemctl enable nginx
          systemctl restart nginx

          # 6. Set directory ownership and PM2 boot startup
          chown -R ubuntu:ubuntu /var/www/app
          sudo -u ubuntu pm2 startup systemd -u ubuntu --hp /home/ubuntu | tail -1 | bash

Outputs:
  PublicIP:
    Description: Public IP of the server
    Value: !GetAtt ServerInstance.PublicIp

  PublicURL:
    Description: Live Gymshark Web Application URL
    Value: !Sub "http://${ServerInstance.PublicIp}"

  SSMKeyPath:
    Description: Parameter Store path for private SSH key
    Value: !Sub "/ec2/keypair/${ServerKeyPair.KeyPairId}"
